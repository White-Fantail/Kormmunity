name: Kormmunity MCP validation

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: npm test
      - name: Build without production database migrations
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://kormmunity.example
